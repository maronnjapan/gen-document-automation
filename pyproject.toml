[project]
name = "gen-document-automation"
version = "0.1.0"
description = "Confluence Wiki と RAG を使った Markdown ドキュメントの自動生成・自動レビュー"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# バックエンドは行数を抑えるため、短い1行のif文・複数文・lambda代入を許容する
ignore = ["E701", "E702", "E731", "E302", "E305", "E401", "B023", "UP013", "UP015"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E731"]
