# ローカル開発環境
#   Redis / S3・SQS互換サーバー(moto) / モック(独自LLM・Confluence・Slack) / Web API / 生成・レビュー(Lambdaコンテナ) / SQSポーラー
#
# 起動:  docker compose -f infra/docker-compose.yml up --build      → http://localhost:8000
# 実際のLLM・Confluence・Slackにつなぐ場合は、リポジトリ直下の .env（.env.example 参照）を用意して
#        docker compose -f infra/docker-compose.yml --env-file .env up --build
name: doc-automation

x-app-env: &app-env
  AWS_DEFAULT_REGION: ap-northeast-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_ENDPOINT_URL_S3: http://moto:5000
  AWS_ENDPOINT_URL_SQS: http://moto:5000
  S3_BUCKET: doc-automation
  REDIS_URL: redis://redis:6379/0
  GENERATION_QUEUE_URL: http://moto:5000/123456789012/generation-queue
  REVIEW_QUEUE_URL: http://moto:5000/123456789012/review-queue
  LLM_URL: ${LLM_URL:-http://mock:8090/llm}
  LLM_API_KEY: ${LLM_API_KEY:-local-dummy-key}
  LLM_API_KEY_HEADER: ${LLM_API_KEY_HEADER:-}
  LLM_API_KEY_FORMAT: ${LLM_API_KEY_FORMAT:-}
  LLM_REQUEST_TEMPLATE: ${LLM_REQUEST_TEMPLATE:-}
  LLM_RESPONSE_PATH: ${LLM_RESPONSE_PATH:-}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-}
  CONFLUENCE_URL: ${CONFLUENCE_URL:-http://mock:8090/wiki}
  CONFLUENCE_TOKEN: ${CONFLUENCE_TOKEN:-local-dummy-token}
  CONFLUENCE_AUTH_FORMAT: ${CONFLUENCE_AUTH_FORMAT:-}
  CONFLUENCE_CQL: ${CONFLUENCE_CQL:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://mock:8090/slack}
  APP_URL: ${APP_URL:-http://localhost:8000}
  AWS_LAMBDA_FUNCTION_TIMEOUT: "900"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  moto:  # S3・SQS 互換のローカルサーバー（バケットとキューは poller が起動時に作成）
    image: motoserver/moto:5.2.5
    ports: ["5000:5000"]

  mock:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: ["python", "infra/local/mock_services.py"]
    volumes: ["./local:/app/infra/local:ro"]
    ports: ["8090:8090"]

  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: *app-env
    ports: ["8000:8080"]
    depends_on: [redis, moto, poller]

  generator:
    build: { context: .., dockerfile: infra/Dockerfile.generator }
    environment: *app-env
    depends_on: [redis, moto]

  reviewer:
    build: { context: .., dockerfile: infra/Dockerfile.reviewer }
    environment: *app-env
    depends_on: [redis, moto]

  poller:  # 本番の Lambda イベントソースマッピングの代わり
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: ["python", "infra/local/poller.py"]
    volumes: ["./local:/app/infra/local:ro"]
    environment:
      <<: *app-env
      GENERATION_TARGET: http://generator:8080/2015-03-31/functions/function/invocations
      REVIEW_TARGET: http://reviewer:8080/2015-03-31/functions/function/invocations
    depends_on: [moto, generator, reviewer]
